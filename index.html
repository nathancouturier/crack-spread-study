<!-- Every path on this page is relative. The site is served from the subpath
     /crack-spread-study/, never from a domain root, so a leading slash breaks
     the deploy. tools/check-paths.mjs fails the gate on one, and
     scripts/serve.py reproduces the subpath locally. SPEC.md section 0.1. -->

<!-- An empty data URI, so the browser does not ask the origin root for a
     favicon, which on a project page is somebody else's file. -->
<link rel="icon" href="data:,">

<!-- The theme, set before the first paint. docs/design.md Part 3 section 7,
     declared difference 3: the portfolio sets data-theme from script at the end
     of the page, which paints one light frame for a visitor who chose dark. This
     reads the same key, nc-theme, which the portfolio shares because both sites
     live on the same origin. A blocked store falls back to light, the value the
     html element already ships with. src/theme.js owns the toggle after load. -->
<script>
  (function () {
    try {
      if (localStorage.getItem("nc-theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", "#17181C");
      }
    } catch (error) {
      /* storage blocked: stay light */
    }
  })();
</script>

<!-- Content hashes, so a deploy changes the URL of every file whose bytes
     changed and a cache cannot hand this page yesterday's module beside today's
     data. make build writes the import map below from the bytes on disk, and
     the ?v= on the stylesheets and the entry module; make build-check fails if
     any of them is stale. src/crack/versions.py says why and what it cannot
     do; src/state.js holds the guard for that part. The map must come before
     the first module script. -->
